name: Linux release

# When a release is published (scripts/release.ps1 creates it with the
# Windows installer), build the Linux program, attach it, and add its
# checksum to the release's SHA256SUMS.txt so self-update can verify it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Libraries (GTK, WebKit)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        run: go test ./...
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          go build -tags desktop,production,webkit2_41 -trimpath \
            -ldflags "-w -s -X github.com/thangkes/cmdex/internal/app.Version=${VERSION}" -o dist/cmdex .
          cp build/appicon.png dist/cmdex.png
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/
          cp packaging/linux/cmdex.desktop packaging/linux/install.sh dist/
          chmod +x dist/install.sh
          ARCHIVE="Cmdex-Linux-amd64-${VERSION}.tar.gz"
          tar -C dist -czf "$ARCHIVE" cmdex cmdex.png cmdex.desktop install.sh LICENSE THIRD-PARTY-NOTICES.txt
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p sums
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir sums || touch sums/SHA256SUMS.txt
          grep -v " ${ARCHIVE}\$" sums/SHA256SUMS.txt > sums/new.txt || true
          sha256sum "$ARCHIVE" >> sums/new.txt
          mv sums/new.txt sums/SHA256SUMS.txt
          gh release upload "$TAG" "$ARCHIVE" sums/SHA256SUMS.txt --clobber
